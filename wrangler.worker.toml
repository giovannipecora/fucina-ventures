# Fucina.Ventures su Cloudflare Workers (sito statico + modulo)
name = "fucina-ventures"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
# Indirizzo da cui parte l'email: deve essere sul vostro dominio (Email Routing attivo)
MITTENTE = "sito@fucina.ventures"
# Dove arrivano le proposte: deve essere un indirizzo VERIFICATO in Email Routing
DESTINATARIO = "ciao@fucina.ventures"

[[send_email]]
name = "EMAIL"
destination_address = "ciao@fucina.ventures"

[[r2_buckets]]
binding = "PROPOSTE"
bucket_name = "fucina-proposte"

[observability]
enabled = true
